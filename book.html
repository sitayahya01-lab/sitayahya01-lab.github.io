<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Table · Little Lemon</title>
  <style>
    :root { --lemon:#fff3a8; --lemon-deep:#f5d90a; --leaf:#2f7d4f; --ink:#2b2a22; --paper:#fffdf0; --line:#eadf8a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Trebuchet MS","Segoe UI",sans-serif; background:var(--paper); color:var(--ink); line-height:1.5; }
    header { background:var(--lemon); text-align:center; padding:28px 16px 20px; border-bottom:3px solid var(--lemon-deep); }
    .deco { font-size:1.6rem; letter-spacing:.4rem; }
    header h1 { margin:6px 0 0; font-size:2.4rem; }
    header h1 a { color:var(--ink); text-decoration:none; }
    header p { margin:4px 0; }
    nav { margin-top:12px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    nav a { color:var(--ink); background:#fff; border:2px solid var(--lemon-deep); border-radius:999px; padding:6px 16px; text-decoration:none; font-weight:bold; }
    nav a:hover, nav a:focus-visible { background:var(--lemon-deep); outline:none; }
    nav a.current { background:var(--lemon-deep); }
    main { max-width:760px; margin:0 auto; padding:24px 16px 8px; }
    .card { background:#fff; border:2px solid var(--line); border-radius:18px; padding:20px; margin:16px 0; }
    table { width:100%; border-collapse:collapse; }
    td { padding:8px 4px; border-bottom:1px solid var(--line); }
    label { display:block; font-weight:bold; margin-top:14px; }
    input, select { width:100%; padding:10px; margin-top:4px; border:2px solid var(--line); border-radius:10px; font:inherit; }
    input:focus, select:focus { outline:none; border-color:var(--lemon-deep); }
    button { margin-top:18px; background:var(--lemon-deep); color:var(--ink); border:none; border-radius:999px; padding:10px 24px; font:inherit; font-weight:bold; cursor:pointer; }
    button:hover, button:focus-visible { background:#e0c500; }
    #ok { display:none; background:#e6f6ea; border:2px solid var(--leaf); border-radius:12px; padding:12px 16px; margin-top:16px; }
    footer { text-align:center; padding:28px 16px 36px; color:#6b6a55; }
  </style>
</head>
<body>
  <header>
    <div class="deco" aria-hidden="true">🧆 ✨ 🍋 ✨ 🥗</div>
    <h1><a href="index.html">Little Lemon</a></h1>
    <p>Middle Eastern food in the Main District</p>
    <p>open daily 11:00–22:00 · come hungry</p>
    <nav>
      <a href="index.html">Menu</a>
      <a href="location.html">Location</a>
      <a href="book.html" class="current">Book a Table</a>
    </nav>
  </header>
  <main>
    <h2>Book a Table</h2>
    <div class="card">
      <form id="f">
        <label for="name">Name</label>
        <input id="name" required>
        <label for="date">Date</label>
        <input id="date" type="date" required>
        <label for="time">Time</label>
        <input id="time" type="time" min="11:00" max="22:00" required>
        <label for="guests">Guests</label>
        <select id="guests">
          <option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6+</option>
        </select>
        <button type="submit">Book now</button>
      </form>
      <div id="ok" role="status"></div>
    </div>
    <script>
      document.getElementById('f').addEventListener('submit', function (e) {
        e.preventDefault();
        var ok = document.getElementById('ok');
        ok.textContent = 'Thanks, ' + document.getElementById('name').value + '! Table for ' +
          document.getElementById('guests').value + ' on ' + document.getElementById('date').value +
          ' at ' + document.getElementById('time').value + '. See you soon 💛';
        ok.style.display = 'block';
      });
    </script>
  </main>
  <footer>
    <p><strong>Little Lemon 🍋</strong></p>
    <p>123 Rome Road, Main District, Capital City</p>
    <p>Open daily, 11:00–22:00 · (021) 555 0123</p>
    <p>see you soon, bestie 💛</p>
  </footer>
</body>
</html>
